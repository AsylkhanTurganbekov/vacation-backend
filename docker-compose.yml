version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: vacation-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vacation_db}
      POSTGRES_USER: ${POSTGRES_USER:-vacation_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vacation_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vacation_user} -d ${POSTGRES_DB:-vacation_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  vacation-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vacation-backend-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8081}
      SERVER_CONTEXT_PATH: ${SERVER_CONTEXT_PATH:-/}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:postgresql://postgres:5432/vacation_db}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-vacation_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-vacation_password}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF0123456789ABCDEF}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-86400000}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-*}
      APP_OPENAPI_LOCAL_URL: ${APP_OPENAPI_LOCAL_URL:-http://localhost:${BACKEND_EXTERNAL_PORT:-8090}}
      APP_OPENAPI_PROD_URL: ${APP_OPENAPI_PROD_URL:-}
      APP_STORAGE_AVATAR_DIR: ${APP_STORAGE_AVATAR_DIR:-/app/uploads/avatars}
      APP_STORAGE_TRIP_EVENT_IMAGE_DIR: ${APP_STORAGE_TRIP_EVENT_IMAGE_DIR:-/app/uploads/trip-events}
      APP_BIOMETRIC_PROVIDER_NAME: ${APP_BIOMETRIC_PROVIDER_NAME:-mock-face-provider}
      APP_INTEGRATIONS_BITRIX_API_KEY: ${APP_INTEGRATIONS_BITRIX_API_KEY:-}
      FIREBASE_SERVICE_ACCOUNT_PATH: ${FIREBASE_SERVICE_ACCOUNT_PATH:-}
      FIREBASE_SERVICE_ACCOUNT_BASE64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_EXTERNAL_PORT:-8090}:8081"
    volumes:
      - avatar_uploads:/app/uploads
      - ${FIREBASE_SECRETS_DIR:-./.secrets}:/opt/secrets:ro

  nginx:
    image: nginx:1.27-alpine
    container_name: vacation-nginx
    restart: unless-stopped
    profiles:
      - proxy
    depends_on:
      - vacation-backend
    ports:
      - "${NGINX_HTTP_PORT:-8090}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
  avatar_uploads:
