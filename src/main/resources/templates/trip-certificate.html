<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Командировочное удостоверение</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 32px; color: #111; }
        h1, h2 { margin: 0 0 12px; }
        .header { display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:24px; gap: 24px; }
        .meta { border:1px solid #222; padding:12px; min-width:260px; }
        .field { margin: 8px 0; }
        .label { font-weight:700; }
        table { width:100%; border-collapse:collapse; margin-top:16px; }
        th, td { border:1px solid #444; padding:8px; text-align:left; vertical-align:top; }
        .muted { color:#555; font-size:12px; }
    </style>
</head>
<body>
<div class="header">
    <div>
        <div class="muted" th:text="${certificate.organizationName}"></div>
        <h1>Командировочное удостоверение</h1>
    </div>
    <div class="meta">
        <div><span class="label">Номер документа:</span> <span th:text="${certificate.documentNumber}"></span></div>
        <div><span class="label">Дата составления:</span> <span th:text="${certificate.documentDate}"></span></div>
    </div>
</div>

<div class="field"><span class="label">Работник:</span> <span th:text="${certificate.employeeFullName}"></span></div>
<div class="field"><span class="label">Подразделение:</span> <span th:text="${certificate.department}"></span></div>
<div class="field"><span class="label">Должность:</span> <span th:text="${certificate.position}"></span></div>
<div class="field"><span class="label">Табельный номер:</span> <span th:text="${certificate.personnelNumber}"></span></div>
<div class="field"><span class="label">Командируется в:</span> <span th:text="${certificate.destinationAddress}"></span></div>
<div class="field"><span class="label">Цель:</span> <span th:text="${certificate.purpose}"></span></div>
<div class="field">
    <span class="label">Период:</span>
    с <span th:text="${certificate.plannedStartDateTime}"></span>
    по <span th:text="${certificate.plannedEndDateTime}"></span>
</div>
<div class="field"><span class="label">Календарных дней:</span> <span th:text="${certificate.calendarDays}"></span></div>

<h2>Отметки по поездке</h2>
<table>
    <thead>
    <tr>
        <th>Тип</th>
        <th>Место</th>
        <th>Дата и время</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="mark : ${certificate.marks}">
        <td th:text="${mark.label}"></td>
        <td th:text="${mark.place}"></td>
        <td th:text="${mark.eventTime}"></td>
    </tr>
    </tbody>
</table>
</body>
</html>
