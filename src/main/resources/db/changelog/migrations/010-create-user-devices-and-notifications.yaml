databaseChangeLog:
  - changeSet:
      id: 010-01-create-user-devices-table
      author: codex
      changes:
        - createTable:
            tableName: user_devices
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: push_token
                  type: VARCHAR(2048)
                  constraints:
                    nullable: false
              - column:
                  name: platform
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: device_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: device_name
                  type: VARCHAR(255)
              - column:
                  name: app_version
                  type: VARCHAR(50)
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: user_devices
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_devices_user
        - addUniqueConstraint:
            tableName: user_devices
            columnNames: push_token
            constraintName: uk_user_devices_push_token
        - addUniqueConstraint:
            tableName: user_devices
            columnNames: user_id,device_id
            constraintName: uk_user_devices_user_device
        - createIndex:
            tableName: user_devices
            indexName: idx_user_devices_user_active
            columns:
              - column:
                  name: user_id
              - column:
                  name: is_active
  - changeSet:
      id: 010-02-create-notifications-table
      author: codex
      changes:
        - createTable:
            tableName: notifications
            columns:
              - column:
                  name: id
                  type: BIGSERIAL
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: trip_id
                  type: BIGINT
              - column:
                  name: type
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: body
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: event_key
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: click_action
                  type: VARCHAR(100)
              - column:
                  name: old_status
                  type: VARCHAR(30)
              - column:
                  name: new_status
                  type: VARCHAR(30)
              - column:
                  name: payload_json
                  type: TEXT
              - column:
                  name: is_read
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
              - column:
                  name: read_at
                  type: TIMESTAMP
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_notifications_user
        - addForeignKeyConstraint:
            baseTableName: notifications
            baseColumnNames: trip_id
            referencedTableName: business_trips
            referencedColumnNames: id
            constraintName: fk_notifications_trip
        - addUniqueConstraint:
            tableName: notifications
            columnNames: user_id,event_key
            constraintName: uk_notifications_user_event_key
        - createIndex:
            tableName: notifications
            indexName: idx_notifications_user_created_at
            columns:
              - column:
                  name: user_id
              - column:
                  name: created_at
