name: Build And Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compile
        run: mvn -B -q -DskipTests compile

      - name: Package
        run: mvn -B -q -DskipTests package

  deploy:
    name: Deploy To Server
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create deploy archive
        run: |
          tar \
            --exclude=.git \
            --exclude=.github \
            --exclude=.idea \
            --exclude=.tools \
            --exclude=target \
            --exclude=.env \
            --exclude=vacation-backend-deploy.tar.gz \
            -czf vacation-backend-deploy.tar.gz .

      - name: Configure SSH key
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SERVER_PORT }}" "${{ secrets.SERVER_HOST }}" >> ~/.ssh/known_hosts

      - name: Copy archive to server
        run: |
          scp -i ~/.ssh/deploy_key \
            -P "${{ secrets.SERVER_PORT }}" \
            vacation-backend-deploy.tar.gz \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/tmp/vacation-backend-deploy.tar.gz"

      - name: Deploy over SSH
        run: |
          ssh -i ~/.ssh/deploy_key \
            -p "${{ secrets.SERVER_PORT }}" \
            "${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}" <<'EOF'
          set -e
          mkdir -p /var/www/vacation-backend
          tar -xzf /tmp/vacation-backend-deploy.tar.gz -C /var/www/vacation-backend
          find /var/www/vacation-backend -name '._*' -delete || true
          cd /var/www/vacation-backend
          docker compose up --build -d
          EOF
