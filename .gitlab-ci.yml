stages:
  - test
  - package
  - docker
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  DOCKER_TLS_CERTDIR: "/certs"
  IMAGE_NAME: "$CI_REGISTRY_IMAGE/vacation-backend"

cache:
  paths:
    - .m2/repository

compile:
  stage: test
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - mvn -B -q -DskipTests compile
  only:
    - branches
    - merge_requests

package:
  stage: package
  image: maven:3.9.9-eclipse-temurin-21
  script:
    - mvn -B -q -DskipTests package
  artifacts:
    paths:
      - target/*.jar
    expire_in: 1 day
  only:
    - branches
    - merge_requests

docker-build:
  stage: docker
  image: docker:27.1.1
  services:
    - docker:27.1.1-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_NAME:$CI_COMMIT_SHA" -t "$IMAGE_NAME:latest" .
    - docker push "$IMAGE_NAME:$CI_COMMIT_SHA"
    - docker push "$IMAGE_NAME:latest"
  only:
    - main

deploy-prod:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
  script:
    - ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd $DEPLOY_PATH && docker compose pull && docker compose up -d --remove-orphans"
  only:
    - main
  when: manual
